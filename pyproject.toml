[project]
name = "certification-estimators"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphical-toolbox",
    "plotly>=6.8.0",
    "plotly-express>=0.4.1",
    "tikzplotly>=0.2.2",
]

[tool.uv.sources]
graphical-toolbox = { path = "../../../software/graphical-toolbox", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["certification_estimators"]
