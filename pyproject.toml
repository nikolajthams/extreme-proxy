[project]
name = "extreme-proxy"
version = "1.0.0"
description = "Code for 'Extreme proxies for causal identification: deconfounding with outliers' (Bodik and Thams)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.5",
    "numpy>=2.3",
    "polars>=1.40",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["certification_estimators", "hydro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
